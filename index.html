<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyperStage PV</title>
<style>
  :root { color-scheme: dark; font-family: "PingFang TC", "Noto Sans TC", sans-serif; --transport-space: 118px; }
  html, body { margin: 0; height: 100%; background: #0b0910; color: #f3ecff; overflow: hidden; }
  /* Sit the frame above the transport so the lyric band and the cast's feet stay visible. */
  #out { position: absolute; left: 0; right: 0; top: 0; margin-inline: auto; width: min(100vw, calc((100dvh - var(--transport-space) - env(safe-area-inset-bottom, 0px)) * 16 / 9)); aspect-ratio: 16 / 9; height: auto; max-height: calc(100dvh - var(--transport-space) - env(safe-area-inset-bottom, 0px)); display: block; background: #000; }
  #gl { position: absolute; left: -99999px; top: 0; }
  /* The song list is taller than a phone. Body stays locked so the player
     does not scroll; this overlay is the scroll container. margin: auto
     centers it when it fits, and collapses so a tall list starts at the top. */
  #menu { position: fixed; z-index: 2; left: 0; right: 0; top: 0; height: 100dvh; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: #0b0910e6; }
  #menu[hidden] { display: none; }
  #menu .inner { width: min(920px, 92vw); margin-inline: auto; margin-block: auto; padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); flex: 0 0 auto; }
  #menu h1 { font-size: 28px; margin: 0 0 6px; }
  #menu p { color: #b9a9d0; margin: 0 0 18px; font-size: 14px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  #list button { text-align: left; font: inherit; color: inherit; background: #221b30; border: 1px solid #3d3153; border-radius: 12px; padding: 14px 16px; cursor: pointer; }
  #list button:hover { border-color: #bca8ff; background: #2d2440; }
  #list small { color: #9c8bb4; display: block; font-size: 11px; letter-spacing: 2px; }
  #list strong { display: block; margin: 4px 0; font-size: 15px; }
  #list .song-group { background: #221b30; border: 1px solid #3d3153; border-radius: 12px; padding: 14px 16px; }
  #list .song-group p { font-size: 12px; line-height: 1.5; margin: 6px 0 12px; }
  .song-languages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  #list .song-languages button { min-height: 44px; text-align: center; padding: 6px; font-size: 13px; background: #30263f; }
  #menu .v2 { display: inline-block; margin-top: 18px; color: #d8c6ff; font-size: 14px; text-decoration: none; border: 1px solid #4a3d66; border-radius: 999px; padding: 8px 16px; }
  #menu .v2:hover { border-color: #bca8ff; background: #2d2440; }
  #status { position: absolute; left: 16px; right: 16px; bottom: calc(var(--transport-space) + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: #c9b8e6; z-index: 3; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #transport { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; display: grid; gap: 6px; padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(#0b091000, #0b0910 24px); }
  #transport[hidden] { display: none; }
  #transport input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; margin: 0; background: transparent; touch-action: none; accent-color: #bca8ff; }
  #transport input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: #3d3153; border-radius: 999px; }
  #transport input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border: 0; border-radius: 50%; background: #bca8ff; }
  #transport input[type="range"]::-moz-range-track { height: 6px; background: #3d3153; border: 0; border-radius: 999px; }
  #transport input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #bca8ff; }
  #transport .timeline, #transport .controls, #transport .track-controls, #transport .seek-controls, #transport .volume-controls { display: flex; align-items: center; gap: 8px; }
  #transport .timeline input { flex: 1; min-width: 0; }
  #transport .controls { flex-wrap: wrap; }
  #transport .track-controls { margin-right: auto; }
  #transport .volume-controls { flex: 0 1 240px; min-width: 160px; }
  #transport #volume { flex: 1; min-width: 40px; width: auto; }
  #volume-value { min-width: 4ch; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  #transport button, #transport select { font: inherit; color: inherit; background: #221b30; border: 1px solid #3d3153; border-radius: 999px; min-width: 52px; min-height: 44px; padding: 8px 12px; }
  #transport button:hover, #transport select:hover { border-color: #bca8ff; background: #2d2440; }
  #transport button:disabled { opacity: .4; cursor: default; }
  #transport button:focus-visible, #transport input:focus-visible, #transport select:focus-visible { outline: 2px solid #bca8ff; outline-offset: 2px; }
  #transport button.play { background: #bca8ff; color: #221c37; border-color: #bca8ff; font-weight: 700; }
  #clock { margin-left: auto; color: #c9b8e6; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 900px) {
    :root { --transport-space: 178px; }
    #transport { padding-inline: 12px; }
    #transport .track-controls { flex-basis: 100%; justify-content: center; margin-right: 0; }
    #transport .volume-controls { flex: 1; min-width: 130px; }
    #transport button, #transport select { min-width: 44px; padding-inline: 10px; font-size: 13px; }
  }
  @media (max-width: 350px) {
    :root { --transport-space: 226px; }
  }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<div id="menu" hidden>
  <div class="inner">
    <h1>HyperStage PV</h1>
    <p>9 首 PV・36 個語言版本，選擇中文／英文／日文／粵文即可播放。可切換上一首／下一首、拖時間軸、調整音量；鍵盤可用 Space、← →、P／N 換歌、M 靜音、Esc 選單。</p>
    <div id="list"></div>
    <a class="v2" href="./v2.html">第二版本：3D 編輯器與歌詞劇場 →</a>
  </div>
</div>
<div id="status"></div>
<div id="transport" hidden>
  <div class="timeline">
    <input id="scrub" type="range" min="0" max="0" value="0" step="0.1" aria-label="時間軸">
    <span id="clock"><span id="elapsed">0:00</span> / <span id="total">0:00</span></span>
  </div>
  <div class="controls">
    <div class="track-controls">
      <button type="button" id="back">選單</button>
      <button type="button" id="previous" title="上一首 (P)">⏮ 上一首</button>
      <button type="button" id="play" class="play">播放</button>
      <button type="button" id="next" title="下一首 (N)">下一首 ⏭</button>
    </div>
    <div class="seek-controls">
      <button type="button" id="rewind" aria-label="倒退 5 秒">−5</button>
      <button type="button" id="forward" aria-label="快轉 5 秒">+5</button>
      <select id="speed" aria-label="播放速度" title="播放速度">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <div class="volume-controls">
      <button type="button" id="mute" aria-label="靜音" title="靜音 (M)" aria-pressed="false">🔊</button>
      <input id="volume" type="range" min="0" max="1" value="1" step="0.01" aria-label="音量">
      <output id="volume-value" for="volume">100%</output>
    </div>
  </div>
</div>
<script type="module" src="/src/pv/main.js"></script>
</body>
</html>
